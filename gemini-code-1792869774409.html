    .footer { margin-top: 24px; display: flex; justify-content: flex-end; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .result-screen { text-align: center; padding: 30px 0; display: none; }
    .result-screen h2 { font-size: 22px; margin-bottom: 10px; }
    .result-screen p { font-size: 16px; color: var(--text-muted); margin-bottom: 24px; }

let questions = [];
let currentIndex = 0;
let score = 0;

function shuffle(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  questions = shuffle(rawData).map(q => {
    const optsWithMeta = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.answer }));
    const shuffledOpts = shuffle(optsWithMeta);
    return {
      q: q.q,
      options: shuffledOpts
    };
  });
  currentIndex = 0;
  score = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-body').style.display = 'block';
  updateScore();
  renderQuestion();
}

function updateScore() {
  document.getElementById('score-count').textContent = `To'g'ri: ${score}`;
  document.getElementById('question-count').textContent = `Savol: ${currentIndex + 1} / ${questions.length}`;
  const pct = (currentIndex / questions.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function renderQuestion() {
  updateScore();
  const current = questions[currentIndex];
  document.getElementById('question-text').textContent = (currentIndex + 1) + '. ' + current.q;
  const container = document.getElementById('options-container');
  container.innerHTML = '';
  document.getElementById('next-btn').style.display = 'none';

  current.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(btn, opt.isCorrect);
    container.appendChild(btn);
  });
}

function selectOption(selectedBtn, isCorrect) {
  const container = document.getElementById('options-container');
  const buttons = container.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);

  if (isCorrect) {
    selectedBtn.classList.add('correct');
    score++;
  } else {
    selectedBtn.classList.add('wrong');
    const current = questions[currentIndex];
    current.options.forEach((opt, idx) => {
      if (opt.isCorrect) buttons[idx].classList.add('correct');
    });
  }

  document.getElementById('score-count').textContent = `To'g'ri: ${score}`;
  document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quiz-body').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('progress-bar').style.width = '100%';
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('final-result-text').textContent = `Siz ${questions.length} ta savoldan ${score} tasiga to'g'ri javob berdingiz (${pct}%).`;
}

window.onload = startQuiz;
